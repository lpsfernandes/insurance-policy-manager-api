spring:
  main.banner-mode: "off"
  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: BASIC
            connectTimeout: 2000 #in milliseconds
            readTimeout: 2000 #in milliseconds
            #loggerLevel: FULL
          fraud-prevention-engine:
            url: "http://localhost:${wiremock.server.port}"
  application:
    group: insurance
    name: insurance-policy-manager-api
  datasource:
    url: jdbc:h2:mem:appdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      topics:
        insurance-subscription: topico-subscricao
        payments: topico-pagamentos
        rule-processing: topico-validacao-regras
        risk-analysis-processing: topico-analise-risco
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      topic:
        notification: topico-eventos
        rule-processing: topico-validacao-regras
        risk-analysis-processing: topico-analise-risco

logging:
  level:
    root: ERROR